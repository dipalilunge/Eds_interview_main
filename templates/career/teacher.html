<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Interview Review Queue</title>
  <link rel="stylesheet" href="{{ url_for('career.static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="brand"><img class="eds-logo" src="{{ url_for('static', filename='images/logo.jpeg') }}" alt="EDS logo"><span class="brand-copy"><strong>Interview Evaluation</strong><span>Admin workspace</span></span></div>
  <a href="{{ url_for('career.index') }}">Career page</a>
</header>

<main class="container">
  <h1>Interviews</h1>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Student</th><th>Subject</th><th>Status</th><th>Score</th><th>Action</th></tr></thead>
      <tbody>
      {% for i in interviews %}
        <tr>
          <td>{{ i.student_name }}</td>
          <td>{{ i.subject.name }}</td>
          <td>{{ i.status }}</td>
          <td>{{ i.total_score if i.total_score is not none else "Pending" }}</td>
          <td><a class="button" href="{{ url_for('career.teacher_review', interview_id=i.id) }}">Evaluate</a></td>
        </tr>
      {% else %}
        <tr><td colspan="5">No interviews yet.</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
